name: Python checks
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Public safety preflight
        run: python scripts/public_preflight.py
      - name: Ruff static lint
        run: python -m ruff check .
      - name: Compile all Python
        run: python -m compileall -q retrieval serve.py tests scripts
      - name: Validate shell example
        run: bash -n examples/run-embedding-server.sh
      - name: Unit and offline integration tests
        run: python -m unittest discover -s tests -v
